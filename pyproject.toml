[project]
name = "portfolio-risk-research"
version = "0.1.0"
description = "Tail-risk research memo on a concentrated synthetic equity portfolio (Quarto + Python)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "statsmodels>=0.14",
    "pyarrow>=14.0",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "nbformat>=5.9",
    "nbclient>=0.9",
    "pyyaml>=6.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# The analysis package is `src/` (imported as `from src import ...`). Hatchling's
# editable install writes a plain .pth entry for the project root into the venv,
# so the package resolves from any working directory *and* is visible to static
# checkers (Pyrefly, Pylance) that read the interpreter's sys.path.
[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pyrefly]
# Positron's Pyrefly checker: resolve `from src import ...` from files under
# reports/ and tests/ the same way Quarto (execute-dir: project) and pytest do.
project-includes = ["src", "tests", "scripts", "reports"]
search-path = ["."]
python-version = "3.11"
