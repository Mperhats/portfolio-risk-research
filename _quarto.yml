project:
  type: default
  title: "Tail Risk in a Concentrated Equity Portfolio"
  render:
    - reports/portfolio_risk_review.qmd
  execute-dir: project

engine: jupyter
jupyter: python3

execute:
  echo: false
  warning: false
  message: false
  error: false
  freeze: false

bibliography: references.bib
link-citations: true

number-sections: true
fig-dpi: 150

format:
  html:
    theme: styles.scss
    toc: true
    toc-depth: 2
    toc-location: left
    toc-title: "Contents"
    embed-resources: true
    fig-format: svg
    fig-responsive: true
    # Figures and tables stay in the text column; captions and citations use
    # the margin, which keeps the Tufte feel without charts overrunning the text.
    cap-location: margin
    reference-location: margin
    citation-location: margin
    grid:
      sidebar-width: 220px
      body-width: 720px
      margin-width: 300px
      gutter-width: 2rem
    html-math-method: katex
    code-tools: false
    anchor-sections: false
    smooth-scroll: true
  # LaTeX PDF (Positron's Render PDF; `uv run render pdf`). Figures stay in
  # reading order and within the text width.
  pdf:
    documentclass: article
    papersize: a4
    fontsize: 10.5pt
    geometry:
      - margin=2.6cm
    linestretch: 1.1
    colorlinks: true
    linkcolor: memoblue
    citecolor: memoblue
    urlcolor: memoblue
    include-in-header:
      text: |
        \definecolor{memoblue}{HTML}{25609f}
        \usepackage{float}
    fig-pos: "H"
    fig-format: pdf
    cap-location: bottom
    reference-location: document
    citation-location: document
    toc: false
    keep-tex: false
  # Typst PDF, no TeX needed (`uv run render typst`).
  typst:
    output-file: portfolio_risk_review-typst.pdf
    papersize: a4
    fontsize: 10.5pt
    margin:
      x: 2.6cm
      y: 2.6cm
    fig-format: svg
    number-sections: true
    toc: false
    keep-typ: false
    bibliographystyle: chicago-author-date
